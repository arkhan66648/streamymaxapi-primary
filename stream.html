<script>
  const API_BASE = 'https://ws.kora-api.space/api/matches';

  const LANG_FLAGS = {
    English: '🇬🇧', Spanish: '🇪🇸', Italian: '🇮🇹', Italien: '🇮🇹',
    Deutch: '🇩🇪', French: '🇫🇷', Portuguese: '🇵🇹', Arabic: '🇸🇦',
  };

  const params = new URLSearchParams(location.search);
  const matchId = parseInt(params.get('id'));
  const streamIdx = parseInt(params.get('s') || '0');

  let currentMatch = null;
  let allMatches = [];
  let activeStream = streamIdx;

  function formatTime(iso) {
    const d = new Date(iso);
    const now = new Date();
    const diff = d - now;
    if (diff < 0 && diff > -7200000) return 'In progress';
    if (diff >= 0 && diff < 3600000) return `In ${Math.round(diff / 60000)}m`;
    return d.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  async function loadData() {
    try {
      const res = await fetch(`${API_BASE}?per_page=100`);
      const data = await res.json();
      allMatches = data.data || [];

      if (data.total > data.per_page) {
        const pages = Math.ceil(data.total / data.per_page);
        const extra = await Promise.all(
          Array.from({ length: pages - 1 }, (_, i) =>
            fetch(`${API_BASE}?per_page=100&page=${i + 2}`).then(r => r.json())
          )
        );
        extra.forEach(p => { allMatches = allMatches.concat(p.data || []); });
      }

      currentMatch = allMatches.find(m => m.id === matchId);
      if (!currentMatch && allMatches.length) currentMatch = allMatches[0];

      renderHeader();
      renderPlayer();
      renderStreamTabs();
    } catch (e) {
      document.getElementById('matchTitle').textContent = '⚠️ Could not load streams.';
    }
  }

  function renderHeader() {
    if (!currentMatch) return;
    document.title = `Watch ${currentMatch.name} Live – SportStream Live`;
    document.getElementById('matchTitle').textContent = currentMatch.name;

    const badge = document.getElementById('matchBadge');
    if (currentMatch.is_live) {
      badge.className = 'badge-live-header';
      badge.innerHTML = '<div class="pulse"></div> LIVE';
    } else {
      badge.className = 'badge-upcoming-header';
      badge.textContent = '⏰ ' + formatTime(currentMatch.begin_at);
    }

    document.querySelector('meta[name="description"]')?.setAttribute('content',
      `Watch ${currentMatch.name} live stream free online in HD. ${currentMatch.category?.name || ''} streaming – no subscription.`);
  }

  function renderPlayer() {
    if (!currentMatch) return;
    const streams = currentMatch.streams || [];
    const wrap = document.getElementById('playerWrap');

    if (!streams.length) {
      wrap.innerHTML = '<div class="player-placeholder"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>No streams available</span></div>';
      return;
    }

    const s = streams[activeStream] || streams[0];
    wrap.innerHTML = `<iframe
      id="liveIframe"
      src="frame.html?url=${encodeURIComponent(s.url)}"
      allowfullscreen
      allow="autoplay; encrypted-media; fullscreen"
      loading="eager"
      title="Watch ${currentMatch.name} live stream"
    ></iframe>`;
  }

  function renderStreamTabs() {
    if (!currentMatch) return;
    const streams = currentMatch.streams || [];
    const tabs = document.getElementById('streamTabs');
    if (!streams.length) { tabs.style.display = 'none'; return; }

    let html = '<span class="tabs-label">Streams</span>';
    streams.forEach((s, i) => {
      const flag = LANG_FLAGS[s.lang] || '🌐';
      html += `<button class="tab-btn${i === activeStream ? ' active' : ''}" data-idx="${i}">${flag} ${s.lang || 'Stream ' + (i + 1)}</button>`;
    });
    html += `<button class="fullscreen-btn" id="fsBtn">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
      Fullscreen
    </button>`;
    tabs.innerHTML = html;

    tabs.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        activeStream = +btn.dataset.idx;
        tabs.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderPlayer();
      });
    });

    document.getElementById('fsBtn')?.addEventListener('click', () => {
      const iframe = document.getElementById('liveIframe');
      if (iframe?.requestFullscreen) iframe.requestFullscreen();
    });
  }


  if (!matchId) {
    document.getElementById('matchTitle').textContent = 'No match selected';
  } else {
    loadData();
  }
</script>
